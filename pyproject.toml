[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentelemetry-instrumentation-aioodbc"
dynamic = ["version"]
description = "OpenTelemetry Aioodbc instrumentation"
readme = "README.rst"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "aioodbc ~= 0.5",
  "opentelemetry-api ~= 1.44",
  "opentelemetry-instrumentation == 0.65b0",
  "opentelemetry-semantic-conventions == 0.65b0",
]

[project.entry-points.opentelemetry_instrumentor]
aioodbc = "opentelemetry.instrumentation.aioodbc:AioodbcInstrumentor"

[tool.hatch.version]
path = "src/opentelemetry/instrumentation/aioodbc/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/opentelemetry"]
